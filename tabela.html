<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <a href="index.html"><img src="icone/conect.jpg" alt="icone de conexão remota" /></a>
    <br/>
    <h1>TABELAS DO PROJETO</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>NOME</th>
            <th>CIDADE</th>
        </tr>
        <tr>
            <td rowspan="2">linha 1, celula 1</td>
            <td rowspan="2">linha 1, celula 2</td>
            <td colspan="3">linha 1, celula 3</td>
        </tr>
        <tr>
            <td rowspan="4">linha 2, celula 1</td>
            <td>linha 2, celula 2</td>
            <td>linha 2, celula 3</td>
        </tr>
        <tr>
            <td>linha 3, celula 1</td>
            <td>linha 3, celula 2</td>
            <td>linha 3, celula 3</td>
        </tr>
    </table>
    <br/>
    <table border="1">
        <tr>
            <td rowspan="2">Bill Gates</td>
            <th colspan="2">Telefone</th>
        </tr>
        <tr>
            <td>555 77 854</td>
            <td>555 77 855</td>
        </tr>
    </table>



</body>
</html>
