<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <a href="../index.html"><img src="../icone/conect.jpg" alt="icone de conexão remota" /></a>
    <p>

        <button type="button" class="btn btn-outline-primary"><a href="../index.html">Home</a></button>
        <button type="button" class="btn btn-outline-secondary">Secondary</button>
        <button type="button" class="btn btn-outline-success">Success</button>
        <button type="button" class="btn btn-outline-danger">Danger</button>
        <button type="button" class="btn btn-outline-warning">Warning</button>
        <button type="button" class="btn btn-outline-info">Info</button>
        <button type="button" class="btn btn-outline-light">Light</button>
        <button type="button" class="btn btn-outline-dark">Dark</button>

        <h1>Formulário de cadastro de usuário</h1>

        <form action="bd.html" method="get" name="cad_user">
            <label>Informe seu nome:<input type="text" name="nome" id="nome" required ></label><br/>
            <label>Informe sua senha:<input type="password" name="senha" id="senha" required></label><br/>
            <label>Informe seu E-mail:<input type="email" name="email" id="email" placeholder="exemplo@suaempresa.com.br"></label><br/>
            <label>Informe data de nascimento:<input type="date" name="nasc" id="nasc"></label><br/>

            <b>Qual seu meio de transporte primario?</b><br/>
            <label><input type="radio" name="transporte" id="transporte" value="carro"/>Carro</label><br/>
            <label><input type="radio" name="transporte" id="transporte" value="bike"/>Bike</label><br/>
            <label><input type="radio" name="transporte" id="transporte" value="nadando" checked/>Nadando</label><br/>
            
            <b>Qual seu meio de transporte secundario?</b><br/>
            <label><input type="checkbox" name="busao" id="busao" value="onibus">Ônibus</label><br/>
            <label><input type="checkbox" name="aviao" id="aviao" value="aviao" checked>Avião</label><br/>
            <label><input type="checkbox" name="barco" id="barco" value="barco">Barco</label><br/>

        <b>Informe seu estado</b>
	    <br/>
	    <select name="estado">
		    <option value="PE" selected/>PERNAMBUCO
		    <option value="BA" />BAHIA
		    <option value="PB" />PARAIBA
		    <option value="PA"/>PARANÁ
	    </select>

        <br/><b>OBSERVAÇÃO</b><br/>
	    <textarea rows="10" cols="30">
	    O gato estava brincando no jardim.
	    </textarea>
            
        <br/>
        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
        


        </form>

        <div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon1">@</span>
  <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
</div>

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="Recipient’s username" aria-label="Recipient’s username" aria-describedby="basic-addon2">
  <span class="input-group-text" id="basic-addon2">@example.com</span>
</div>

<div class="mb-3">
  <label for="basic-url" class="form-label">Your vanity URL</label>
  <div class="input-group">
    <span class="input-group-text" id="basic-addon3">https://example.com/users/</span>
    <input type="text" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
  </div>
  <div class="form-text" id="basic-addon4">Example help text goes outside the input group.</div>
</div>

<div class="input-group mb-3">
  <span class="input-group-text">$</span>
  <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
  <span class="input-group-text">.00</span>
</div>

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="Username" aria-label="Username">
  <span class="input-group-text">@</span>
  <input type="text" class="form-control" placeholder="Server" aria-label="Server">
</div>

<div class="input-group">
  <span class="input-group-text">With textarea</span>
  <textarea class="form-control" aria-label="With textarea"></textarea>
</div>


</body>
</html>
