<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação e recebimento de dados</title>
</head>
<body>
    <a href="../index.html"><img src="../icone/conect.jpg" alt="icone de conexão remota" /></a>
    <p>

        <h1>Formulário de Envio de Dados</h1>
        <p>
            <fieldset>
                <form action="cripto/password.html" method="post">
                    <legend>Envio de Arquivo</legend>
                    <input type="file" name="anexar" id="anexar"/><br/>
                    <input type="submit" value="Enviar"/>
                </form>
            </fieldset>
        </p>

        <p>
            <fieldset>
                <form action="cripto/password.html" method="post">
                    <legend>Google</legend>
                    <input type="search" name="buscar" id="buscar"/>
                    <input type="submit" value="Go"/>
                </form>
            </fieldset>
        </p>

        <p>
            <fieldset>
                <form action="cripto/password.html" method="post">
                    <legend>URL</legend>
                    <input type="url" name="url" id="url" placeholder="http://exemplo.com.br"/>
                    <input type="submit" value="Enviar"/>
                </form>
            </fieldset>
        </p>
        <p>
            <fieldset>
                <form action="cripto/password.html" method="post">
                    <legend>Assine nosso canal</legend>
                    <label for="email"><input type="email" name="email" id="email"/></label>
                    <input type="image" src="../icone/botao.png" alt="icone no formato de checado">
                </form>
            </fieldset>
        </p>
        <p>
            <video src=""></video>
        </p>
        <p>
            <audio src="../som/alarm.mp3">Alarme</audio>
        </p>

    
</body>
</html>
